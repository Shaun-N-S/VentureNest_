name: Production CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node with caching
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # 3. Backend
      - name: Install Backend
        run: cd Backend && npm ci

      - name: Lint Backend
        run: cd Backend && npm run lint

      - name: Build Backend
        run: cd Backend && npm run build

      # 4. Frontend
      - name: Install Frontend
        run: cd Frontend && npm ci

      - name: Lint Frontend
        run: cd Frontend && npm run lint

      - name: Build Frontend
        run: cd Frontend && npm run build

      # 5. Login to DockerHub
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 6. Build Docker Image
      - name: Build Docker Image
        run: docker build -t shaun1092/venturenest-backend ./Backend

      # 7. Push Docker Image
      - name: Push Docker Image
        run: docker push shaun1092/venturenest-backend

      # 8. Copy Compose + monitoring config to EC2.
      #    Deliberately does NOT include .env — production secrets on the
      #    server are never touched by this workflow.
      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,monitoring"
          target: "~/venturenest"
          strip_components: 0

      # 9. Deploy to EC2 via Docker Compose
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/venturenest
            cd ~/venturenest

            # Idempotent: install the Compose plugin only if it's missing.
            if ! docker compose version >/dev/null 2>&1; then
              echo "docker compose plugin not found - installing..."
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            # One-time migration safety net: if a container named "backend"
            # exists from the old `docker run` deployment (no compose
            # labels), remove it so Compose can claim the name. Once Compose
            # owns "backend", this check is a no-op on every future deploy -
            # it only ever touches the legacy, non-compose container.
            if docker inspect backend >/dev/null 2>&1; then
              OWNER=$(docker inspect backend --format '{{ index .Config.Labels "com.docker.compose.project" }}' 2>/dev/null || true)
              if [ -z "$OWNER" ]; then
                echo "Removing legacy (non-compose) backend container..."
                docker stop backend || true
                docker rm backend || true
              fi
            fi

            docker compose pull
            docker compose up -d

            docker image prune -af || true

            echo "Waiting for backend health check..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:4000/health >/dev/null; then
                echo "Backend is healthy."
                exit 0
              fi
              sleep 4
            done

            echo "Backend did not become healthy in time."
            docker compose logs --tail=50 backend
            exit 1
