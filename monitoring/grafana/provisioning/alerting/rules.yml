apiVersion: 1

groups:
  - orgId: 1
    name: VentureNest Critical Alerts
    folder: VentureNest
    interval: 1m
    rules:
      - uid: venturenest-backend-down
        title: Backend Down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: up{job="venturenest-backend"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        labels:
          severity: critical
          service: venturenest-backend
        annotations:
          summary: "VentureNest backend target is down"
          description: "Prometheus has not seen the venturenest-backend target as up for at least 2 minutes. The health check and all API traffic are likely failing."

      - uid: venturenest-high-error-rate
        title: High Error Rate
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (sum(rate(http_errors_total{job="venturenest-backend"}[5m])) OR on() vector(0)) / sum(rate(http_requests_total{job="venturenest-backend"}[5m])) * 100
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        labels:
          severity: critical
          service: venturenest-backend
        annotations:
          summary: "VentureNest backend error rate above 5%"
          description: "The proportion of 4xx/5xx responses has exceeded 5% for at least 5 minutes. Check the API Overview dashboard's Top Failing Routes panel for the specific route(s) responsible."

      - uid: venturenest-high-memory-usage
        title: High Memory Usage
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: process_resident_memory_bytes{job="venturenest-backend"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [629145600]
              refId: C
        labels:
          severity: critical
          service: venturenest-backend
        annotations:
          summary: "VentureNest backend memory usage above 600MB"
          description: "Resident memory (RSS) has stayed above 600MB for at least 10 minutes. This threshold matches the red band on the Runtime Health dashboard's Memory Usage panel and should be revisited once a container memory limit is configured."
